<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="صفحة مؤقتة إلى أن يتم رفع الموقع." />
    <title>المستودع جاهز لاستقبال الموقع</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Tahoma, Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 640px);
        padding: 40px;
        box-sizing: border-box;
        text-align: center;
        border: 1px solid #334155;
        border-radius: 20px;
        background: #1e293b;
      }

      h1 {
        margin-top: 0;
        color: #f8fafc;
      }

      p {
        margin-bottom: 0;
        line-height: 1.9;
        color: #cbd5e1;
      }

      code {
        direction: ltr;
        display: inline-block;
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>المستودع جاهز لاستقبال موقعك</h1>
      <p>
        هذه صفحة مؤقتة. عند رفع الموقع، استبدل هذا الملف بملف
        <code>index.html</code> الخاص بموقعك مع باقي الملفات والصور.
      </p>
    </main>
  </body>
</html>
